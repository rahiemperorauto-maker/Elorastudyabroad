<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" fill="none" width="100%" height="100%">
  <!-- Elora Study Abroad Primary Logo (Rectangular, Transparent Background) -->
  <defs>
    <!-- Soft shadow for globe -->
    <filter id="globeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#081F45" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Letter E -->
  <path d="M 60 106 L 60 38 L 118 38 L 118 46 L 73 46 L 73 69 L 110 69 L 110 77 L 73 77 L 73 98 L 120 98 L 120 106 Z" fill="#081F45" />
  
  <!-- Letter l -->
  <path d="M 135 106 L 135 34 L 148 34 L 148 106 Z" fill="#081F45" />

  <!-- The Globe as 'o' with Orbit & Airplane -->
  <g transform="translate(232, 70)" filter="url(#globeGlow)">
    <!-- Blue Ocean -->
    <circle cx="0" cy="0" r="34" fill="#081F45" />
    <!-- Detailed Gold Continents (Europe, Africa, Asia, Middle East) -->
    <path d="M -8 -26 C -4 -25 -2 -22 -5 -19 C -7 -16 -4 -13 -6 -10 C -9 -8 -7 -4 -10 -2 C -14 0 -17 -4 -16 -8 C -15 -14 -12 -20 -8 -26 Z" fill="#E8B13C" />
    <path d="M -4 -6 C 2 -8 8 -9 11 -5 C 13 -2 10 3 6 5 C 2 7 -1 12 -2 17 C -4 21 -7 25 -11 27 C -15 28 -17 24 -18 19 C -19 13 -18 8 -13 4 C -9 1 -7 -3 -4 -6 Z" fill="#E8B13C" />
    <path d="M 8 -18 C 14 -18 18 -15 22 -11 C 25 -8 24 -3 21 0 C 17 3 13 4 9 1 C 6 -2 7 -8 9 -12 C 10 -15 8 -17 8 -18 Z" fill="#E8B13C" />
    <path d="M 12 8 C 16 7 20 9 22 13 C 23 17 21 21 17 23 C 13 24 10 21 10 17 C 9 13 11 10 12 8 Z" fill="#E8B13C" />
    
    <!-- Outer Orbit Ring -->
    <path d="M -38 12 C -42 -2 -39 -17 -26 -28 C -12 -38 8 -40 24 -30" stroke="#E8B13C" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M -30 26 C -18 38 4 41 22 34 C 34 29 41 18 40 5" stroke="#E8B13C" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Flight contrail shooting up-right -->
    <path d="M 12 -26 L 36 -46" stroke="#E8B13C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 18 -22 L 32 -34" stroke="#E8B13C" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8" />
    
    <!-- Jet Airplane Silhouette flying toward top-right -->
    <g transform="translate(38, -48) rotate(42) scale(1.1)">
      <!-- Airplane Body -->
      <path d="M 0 -13 C 1 -13 2 -11 2 -7 L 2 3 L 13 9 L 13 12 L 2 9 L 2 15 L 6 19 L 6 21 L 0 19 L -6 21 L -6 19 L -2 15 L -2 9 L -13 12 L -13 9 L -2 3 L -2 -7 C -2 -11 -1 -13 0 -13 Z" fill="#081F45" />
    </g>
  </g>

  <!-- Letter r -->
  <path d="M 288 106 L 288 56 L 300 56 L 300 66 C 304 60 310 55 318 55 C 322 55 326 56 329 58 L 326 69 C 322 67 318 66 314 66 C 306 66 300 72 300 82 L 300 106 Z" fill="#081F45" />

  <!-- Letter a -->
  <path d="M 368 106 L 368 97 C 363 103 355 107 345 107 C 333 107 323 99 323 86 C 323 72 335 65 349 65 C 356 65 362 67 368 70 L 368 67 C 368 59 362 55 354 55 C 347 55 341 58 337 62 L 332 54 C 338 48 347 45 357 45 C 372 45 381 53 381 69 L 381 106 Z M 368 80 C 363 76 357 74 350 74 C 342 74 336 78 336 85 C 336 92 342 97 349 97 C 358 97 365 91 368 83 Z" fill="#081F45" />

  <!-- STUDY ABROAD (Widely tracked bold sans-serif) -->
  <text x="260" y="138" font-family="'Poppins', 'Montserrat', 'Inter', sans-serif" font-size="21" font-weight="700" fill="#081F45" text-anchor="middle" letter-spacing="9">STUDY ABROAD</text>

  <!-- Tagline Row: Graduation Cap + DREAM • EXPLORE • ACHIEVE + Book -->
  <g transform="translate(260, 162)">
    <!-- Graduation Cap Icon -->
    <g transform="translate(-165, -7) scale(0.75)">
      <polygon points="12,2 24,8 12,14 0,8" fill="#081F45" />
      <path d="M4 10.5 L4 16 C 4 19.5 7.5 22 12 22 C 16.5 22 20 19.5 20 16 L 20 10.5" fill="none" stroke="#081F45" stroke-width="2" />
      <path d="M21 9 L23 15 L21.5 15" stroke="#E8B13C" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <circle cx="21.5" cy="15.5" r="1" fill="#E8B13C" />
    </g>

    <!-- Tagline Text with Gold Bullet separators -->
    <text x="-96" y="0" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#081F45" letter-spacing="3" text-anchor="middle">DREAM</text>
    <circle cx="-52" cy="-3.5" r="3" fill="#E8B13C" />
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#081F45" letter-spacing="3" text-anchor="middle">EXPLORE</text>
    <circle cx="52" cy="-3.5" r="3" fill="#E8B13C" />
    <text x="96" y="0" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#081F45" letter-spacing="3" text-anchor="middle">ACHIEVE</text>

    <!-- Open Book Icon -->
    <g transform="translate(150, -8) scale(0.75)">
      <path d="M2 4 C 6 2 10 3 12 5 C 14 3 18 2 22 4 L 22 18 C 18 16 14 17 12 19 C 10 17 6 16 2 18 Z" fill="none" stroke="#081F45" stroke-width="2" />
      <line x1="12" y1="5" x2="12" y2="19" stroke="#081F45" stroke-width="2" />
      <line x1="5" y1="8" x2="10" y2="9.5" stroke="#E8B13C" stroke-width="1.2" />
      <line x1="14" y1="9.5" x2="19" y2="8" stroke="#E8B13C" stroke-width="1.2" />
    </g>
  </g>
</svg>
